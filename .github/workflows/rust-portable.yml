name: Portable Rust binary (no AVX)

# Builds the pocket-tts Rust binary for x86-64 CPUs without AVX/AVX2
# (e.g. Intel Celeron N4100). The published release binaries target
# x86-64-v3 through rust/.cargo/config.toml and crash with SIGILL there.
# Manual trigger only; uploads an artifact, creates no release.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rust-portable.yml'

permissions:
  contents: read

jobs:
  build-portable:
    name: pocket-tts portable / ${{ matrix.cpu }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: goldmont
          - cpu: x86-64
    defaults:
      run:
        shell: bash
        working-directory: rust
    env:
      RUSTFLAGS: '-C target-cpu=${{ matrix.cpu }}'
    steps:
      - uses: actions/checkout@v4

      - name: Remove the local cargo config (it pins target-cpu=x86-64-v3)
        run: rm -f .cargo/config.toml

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: portable-${{ matrix.cpu }}

      - name: Build
        run: cargo build --release --locked

      - name: Report AVX code paths
        run: |
          avx=$(objdump -d target/release/pocket-tts | grep -c '%ymm' || true)
          echo "AVX instructions present: $avx (fine if runtime-dispatched)"

      - name: Run under an emulated CPU without AVX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
          qemu-x86_64 -cpu Nehalem target/release/pocket-tts --help > /dev/null

      - name: Package and smoke test
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          target/release/pocket-tts --help > /dev/null
          mkdir -p ../dist/pocket-tts-portable
          cp target/release/pocket-tts ../dist/pocket-tts-portable/
          cp ../LICENSE ../dist/pocket-tts-portable/
          tar -C ../dist -czf "../dist/pocket-tts-$version-${{ matrix.cpu }}-x86_64-unknown-linux-gnu.tar.gz" pocket-tts-portable
          (cd ../dist && sha256sum ./*.tar.gz > "SHA256SUMS-${{ matrix.cpu }}")
          ls -lh ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-tts-portable-${{ matrix.cpu }}
          path: dist/*
          if-no-files-found: error
